version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: penguine-portal
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=polar_portal_secret_key_prod_2026
      - MONGODB_URI=mongodb://mongo:27017/penguine
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - mongo

  mongo:
    image: mongo:6-jammy
    container_name: penguine-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
